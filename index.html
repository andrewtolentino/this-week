  :root{
    --bg:#EDEAE1;
    --surface:#FAF9F5;
    --ink:#2E2C27;
    --muted:#8B8577;
    --faint:#B1AB9C;
    --line:#E0DBCE;
    --accent:#6C7A5D;
    --accent-soft:#E3E7DA;
    --accent-ink:#FFFFFF;
    --danger:#A65F4E;
    --shadow:0 1px 2px rgba(62,56,44,.05),0 6px 22px rgba(62,56,44,.08);
    --shadow-lg:0 2px 6px rgba(62,56,44,.08),0 18px 50px rgba(62,56,44,.18);
    --sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --mono:'DM Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1B1A16;
      --surface:#272620;
      --ink:#E7E3D8;
      --muted:#98917F;
      --faint:#67624F;
      --line:#37352C;
      --accent:#8C9C79;
      --accent-soft:#39402F;
      --accent-ink:#1B1A16;
      --danger:#C08069;
      --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 22px rgba(0,0,0,.35);
      --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 18px 50px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="light"]{
    --bg:#EDEAE1; --surface:#FAF9F5; --ink:#2E2C27; --muted:#8B8577; --faint:#B1AB9C;
    --line:#E0DBCE; --accent:#6C7A5D; --accent-soft:#E3E7DA; --accent-ink:#FFFFFF; --danger:#A65F4E;
    --shadow:0 1px 2px rgba(62,56,44,.05),0 6px 22px rgba(62,56,44,.08);
    --shadow-lg:0 2px 6px rgba(62,56,44,.08),0 18px 50px rgba(62,56,44,.18);
  }
  :root[data-theme="dark"]{
    --bg:#1B1A16; --surface:#272620; --ink:#E7E3D8; --muted:#98917F; --faint:#67624F;
    --line:#37352C; --accent:#8C9C79; --accent-soft:#39402F; --accent-ink:#1B1A16; --danger:#C08069;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 22px rgba(0,0,0,.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 18px 50px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  button,input,select{touch-action:manipulation}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--sans);
    font-size:16px; line-height:1.45;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:600px;margin:0 auto;padding:28px 16px 90px}

  /* ---------- header ---------- */
  header{padding:0 4px}
  .head-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  header h1{font-size:27px;font-weight:500;letter-spacing:-.02em;margin:0;text-wrap:balance}
  .range{font-family:var(--mono);color:var(--muted);font-size:13px}

  .chip{font-family:var(--mono);font-size:11px;letter-spacing:.02em;color:var(--muted);

  .add-input::placeholder{color:var(--faint)}

  /* ---------- editor ---------- */
  .editor{background:var(--bg);border:1px solid var(--line);border-radius:12px;
    padding:14px;margin:2px 0 14px;display:flex;flex-direction:column;gap:12px}
  .editor .f label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:5px}
  .editor input[type=text],.editor input[type=time],.editor select{
    width:100%;height:40px;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);

  .seg{display:flex;gap:6px;flex-wrap:wrap}

  /* ---------- footer ---------- */

  .pulse{color:var(--muted);animation:pulse 1.3s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  .set-sec{margin-bottom:18px}

    text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .set-sec input[type=password],.set-sec input[type=text]{width:100%;height:41px;font:inherit;font-size:16px;
    color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;margin-bottom:8px}
  .set-sec select{-webkit-appearance:none;appearance:none;height:41px;font:inherit;font-size:14px;
    color:var(--ink);background:var(--bg) url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='10'%20height='6'%3E%3Cpath%20d='M1%201l4%204%204-4'%20fill='none'%20stroke='%238B8577'%20stroke-width='1.5'%20stroke-linecap='round'/%3E%3C/svg%3E") no-repeat right 10px center;
    border:1px solid var(--line);border-radius:8px;padding:6px 28px 6px 10px;flex:none}
  .set-note{font-size:12.5px;color:var(--muted);line-height:1.5;margin:6px 0 0}
  .btn.sm{width:auto;padding:7px 14px;font-size:13.5px;margin-bottom:0}
  .acct-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .acct-row .em{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-family:var(--mono);font-size:12px;color:var(--ink)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:30;
    background:var(--ink);color:var(--bg);font-size:13.5px;padding:10px 18px;border-radius:11px;
    box-shadow:var(--shadow-lg);max-width:88%;text-align:center;opacity:0;transition:opacity .25s ease}
  .toast.show{opacity:1}

  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}

<div class="wrap">
  <header>
    <div class="head-row">
      <h1>This Week</h1>
      <div class="range" id="range"></div>
      <button class="ai-btn" id="dumpBtn" aria-label="Brain dump" title="Brain dump">✎<span class="lbl"> Brain dump</span></button>
    </div>

    <div class="week-bar"><i id="wbar" style="width:0"></i></div>
  </header>

<div id="modalRoot"></div>

<script>
(function(){
"use strict";
const KEY='this-week-v1';
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const DSHORT=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const TODS=['morning','afternoon','evening'];
const TODLBL={morning:'Morning',afternoon:'Afternoon',evening:'Evening'};
const VIEWS=[['days','Days'],['time','Time of day'],['tag','Tags'],['flat','One list'],['past','Past']];

/* ---------- state ---------- */
let S=load();
let openId=null;        // task id with editor open
let subAddId=null;      // task id with quick subtask input open
let addingKey='none';   // window index 0-6, null (anytime), or 'none'
let pendingRollover=null;
let settingsOpen=false;
let confirmArm=null;

function migrate(s){
  if(!s||s.version===2)return s;
  // v1 stored Mon-based day indices against a weekStart
  const ws=s.weekStart?parseISO(s.weekStart):today0();
  for(const t of s.tasks||[]){
    t.date=(t.day==null)?null:iso(addDays(ws,t.day));
    delete t.day;
  }
  delete s.weekStart;
  s.version=2;
  return s;
}
function defaults(s){
  s.tasks=s.tasks||[];s.recurring=s.recurring||[];
  s.moods=s.moods||{};s.habits=s.habits||[];s.habitLog=s.habitLog||{};s.archive=s.archive||{};
  s.habits=s.habits.map(function(x){return typeof x==='string'?{name:x,per:7}:x}); // v1 habits were plain names
  s.deleted=s.deleted||{};s.logU=s.logU||{};s.habitsU=s.habitsU||0;
  return s;
}
function habitNames(){return S.habits.map(function(x){return x.name})}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){
    const s=migrate(JSON.parse(raw));
    if(s.view==='added')s.view='days';
    return defaults(s);
  }}catch(e){}
  return defaults({version:2,tasks:[],recurring:[],view:'days'});
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(typeof schedulePush==='function')schedulePush();}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function touch(t){t.u=Date.now()}
function entomb(id){S.deleted[id]=Date.now()}

/* ---------- dates ---------- */
function today0(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseISO(s){const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function wdIdx(d){return (d.getDay()+6)%7} /* Monday = 0 */
function winDates(){const t0=today0();const w=[];for(let i=0;i<7;i++)w.push(iso(addDays(t0,i)));return w}
function fmtRange(){const a=today0(),b=addDays(a,6);
  return MON[a.getMonth()]+' '+a.getDate()+' – '+(b.getMonth()===a.getMonth()?'':MON[b.getMonth()]+' ')+b.getDate()}
function fmtDayDate(d){return MON[d.getMonth()]+' '+d.getDate()}
function winLabel(i,d){return i===0?'Today':i===1?'Tomorrow':DAYS[wdIdx(d)]}

/* ---------- daily catch-up ---------- */
function seedRecurring(){
  const t0=today0();
  for(const r of S.recurring){
    for(let i=0;i<7;i++){
      const d=addDays(t0,i);
      if(!r.days.includes(wdIdx(d)))continue;
      const ds=iso(d);
      if(!S.deleted[r.id+'@'+ds]&&!S.tasks.some(t=>t.recurringId===r.id&&t.date===ds)){
        S.tasks.push({id:r.id+'@'+ds,title:r.title,date:ds,tags:(r.tags||[]).slice(),subtasks:[],
          done:false,timeOfDay:r.timeOfDay||null,time:r.time||null,createdAt:Date.now(),recurringId:r.id,u:Date.now()});
      }
    }
  }
}
function archivePast(){ /* snapshot outgoing past tasks so the Past view can show them */
  const t0=iso(today0());
  if(!S.archive)S.archive={};
  S.tasks.forEach(function(t){
    if(t.date&&t.date<t0){
      (S.archive[t.date]=S.archive[t.date]||[]).push({title:t.title,done:!!t.done,tags:(t.tags||[]).slice()});
    }
  });
}
function archiveDone(){ /* snapshot done tasks before a manual clear */
  const t0=iso(today0());
  if(!S.archive)S.archive={};
  S.tasks.forEach(function(t){
    if(t.done){
      const d=t.date||t0;
      (S.archive[d]=S.archive[d]||[]).push({title:t.title,done:true,tags:(t.tags||[]).slice()});
    }
  });
}
function ensureDay(){
  const t0=iso(today0());
  const past=S.tasks.filter(t=>t.date&&t.date<t0);
  const movable=past.filter(t=>!t.done&&!t.recurringId);
  if(movable.length){
    pendingRollover={count:movable.length,done:past.filter(t=>t.done).length,total:past.length};
    return;
  }
  archivePast();
  S.tasks.forEach(function(t){if(t.date&&t.date<t0)entomb(t.id)});
  S.tasks=S.tasks.filter(t=>!(t.date&&t.date<t0));
  seedRecurring();save();
  if(past.length&&past.every(t=>t.done)){
    toast('Clean slate — you finished all '+past.length+' from yesterday');
  }
}
function resolveRollover(move){
  const t0=iso(today0());
  const n=pendingRollover?pendingRollover.count:0;
  if(move)for(const t of S.tasks){if(t.date&&t.date<t0&&!t.done&&!t.recurringId){t.date=t0;t.carried=(t.carried||0)+1;touch(t)}}
  archivePast();
  S.tasks.forEach(function(t){if(t.date&&t.date<t0)entomb(t.id)});
  S.tasks=S.tasks.filter(t=>!(t.date&&t.date<t0));
  seedRecurring();pendingRollover=null;save();render();
  toast(move
    ?('Moved '+n+' task'+(n===1?'':'s')+' to today')
    :('Let '+n+' task'+(n===1?'':'s')+' go — fresh start'));
}

/* ---------- task ops ---------- */
function parseQuick(text){
  const tags=[];const words=[];
  for(const w of text.trim().split(/\s+/)){
    if(w.length>1&&w[0]==='#')tags.push(w.slice(1).toLowerCase());else words.push(w);
  }
  return {title:words.join(' '),tags};
}
function addTask(date,text){
  const p=parseQuick(text);if(!p.title)return;
  S.tasks.push({id:uid(),title:p.title,date:date,tags:p.tags,subtasks:[],done:false,
    timeOfDay:null,time:null,createdAt:Date.now(),recurringId:null,u:Date.now()});
  save();
}
function getTask(id){return S.tasks.find(t=>t.id===id)}
function ruleOf(t){return t.recurringId?S.recurring.find(r=>r.id===t.recurringId):null}
function syncRuleFields(t){const r=ruleOf(t);if(!r)return;
  r.title=t.title;r.tags=t.tags.slice();r.timeOfDay=t.timeOfDay;r.time=t.time||null}
function setRepeatDays(t,days){
  if(!days.length){
    if(t.recurringId){
      S.recurring=S.recurring.filter(r=>r.id!==t.recurringId);
      for(const x of S.tasks)if(x.recurringId===t.recurringId)x.recurringId=null;
    }
    save();return;
  }
  let r=ruleOf(t);
  if(!r){r={id:uid(),title:t.title,days:[],tags:t.tags.slice(),timeOfDay:t.timeOfDay,time:t.time||null};
    S.recurring.push(r);t.recurringId=r.id;
    if(t.date==null){
      const t0=today0();
      for(let i=0;i<7;i++){if(days.includes(wdIdx(addDays(t0,i)))){t.date=iso(addDays(t0,i));break}}
    }
  }
  r.days=days.slice().sort();
  syncRuleFields(t);
  S.tasks=S.tasks.filter(x=>!(x.recurringId===r.id&&!x.done&&x.date&&!r.days.includes(wdIdx(parseISO(x.date)))));
  if(!getTask(t.id))openId=null;
  seedRecurring();save();
}
function deleteTask(t){
  entomb(t.id);
  S.tasks=S.tasks.filter(x=>x.id!==t.id);
  if(t.recurringId){const r=ruleOf(t);
    if(r&&t.date!=null){const wd=wdIdx(parseISO(t.date));r.days=r.days.filter(d=>d!==wd);
      if(!r.days.length)S.recurring=S.recurring.filter(x=>x.id!==r.id)}}
  openId=null;save();
}

/* ---------- dom helper ---------- */
function h(tag,attrs){
  const el=document.createElement(tag);
  if(attrs)for(const k in attrs){const v=attrs[k];
    if(k==='class')el.className=v;
    else if(k.slice(0,2)==='on')el.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null)el.setAttribute(k,v===true?'':v);
  }
  for(let i=2;i<arguments.length;i++){
    const kid=arguments[i];
    (Array.isArray(kid)?kid:[kid]).forEach(function(c){
      if(c==null||c===false)return;
      el.append(c.nodeType?c:document.createTextNode(c));
    });
  }
  return el;
}

/* ---------- sorting ---------- */
function todRank(t){return t.timeOfDay==='morning'?1:t.timeOfDay==='afternoon'?2:t.timeOfDay==='evening'?3:4}
function timeMin(t){if(!t.time)return 1e9;return (+t.time.slice(0,2))*60+(+t.time.slice(3,5))}
function sortDay(a,b){return todRank(a)-todRank(b)||timeMin(a)-timeMin(b)||a.createdAt-b.createdAt}
function dateKey(t){return t.date==null?'9999-99-99':t.date}
function dayChip(t){
  if(t.date==null)return'Anytime';
  const w=winDates();
  if(t.date===w[0])return'Today';
  if(t.date===w[1])return'Tomorrow';
  return DSHORT[wdIdx(parseISO(t.date))];
}

/* ---------- render ---------- */
const app=document.getElementById('app');

function render(){
  document.getElementById('range').textContent=fmtRange();
  const done=S.tasks.filter(t=>t.done).length,total=S.tasks.length;
  document.getElementById('wprog').textContent=total?done+' of '+total+' done':'';
  document.getElementById('wbar').style.width=total?Math.round(done/total*100)+'%':'0';
  renderViews();
  renderStrip();
  app.textContent='';
  if(pendingRollover){renderModal();return}
  document.getElementById('modalRoot').textContent='';
  const viewsEl=document.getElementById('views'),stripEl=document.getElementById('strip');
  if(settingsOpen){
    viewsEl.style.display='none';stripEl.style.display='none';
    app.append(settingsPage());
    renderFoot();
    return;
  }
  viewsEl.style.display='';stripEl.style.display='';
  if(S.view==='days')renderDays(false);
  else if(S.view==='time')renderDays(true);
  else if(S.view==='tag')renderTags();
  else if(S.view==='past')renderPast();
  else renderFlat();
  renderFoot();
  if(!S.tasks.length&&S.view==='days'){
    app.prepend(h('p',{class:'empty-week'},'A quiet week so far. Tap + Add under a day — #word becomes a tag.'));

}

function renderViews(){
  const box=document.getElementById('views');box.textContent='';
  for(const v of VIEWS){
    (function(v){
      box.append(h('button',{class:S.view===v[0]?'on':'',role:'tab','aria-selected':S.view===v[0]?'true':'false',

    })(v);

}

function renderStrip(){
  const strip=document.getElementById('strip');strip.textContent='';
  const t0=today0(),w=winDates();
  for(let i=0;i<7;i++){
    (function(i){
      const d=addDays(t0,i);
      const has=S.tasks.some(t=>t.date===w[i]&&!t.done);
      strip.append(h('button',{class:i===0?'today':'','aria-label':winLabel(i,d),onclick:function(){
        if(S.view!=='days'&&S.view!=='time'){S.view='days';save();render()}
        const el=document.getElementById('sec-day-'+i);if(el)el.scrollIntoView({block:'start'});
      }},

      ));
    })(i);
  }
}

const MOODS=['happy','calm','motivated','meh','tired','exhausted','stressed','sad'];
function dayStreak(name){
  let n=0;const t0=today0();
  for(let i=0;i<365;i++){
    const ds=iso(addDays(t0,-i));
    if((S.habitLog[ds]||[]).indexOf(name)>=0)n++;
    else if(i===0)continue; /* today unchecked doesn't break a streak yet */
    else break;
  }
  return n;
}
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-wdIdx(x));return x}
function weekCount(name,mon){
  let n=0;
  for(let i=0;i<7;i++){if((S.habitLog[iso(addDays(mon,i))]||[]).indexOf(name)>=0)n++}
  return n;
}
function habitRow(){
  const t0=iso(today0());
  const cur=S.habitLog[t0]||[];
  const row=h('div',{class:'mood-row'});
  S.habits.forEach(function(hb){
    const name=hb.name,per=hb.per||7;
    const on=cur.indexOf(name)>=0;
    let extra='';
    if(per>=7){
      const st=dayStreak(name);
      if(st>1)extra='·'+st;
    }else{
      /* weekly target: progress this Mon–Sun week + streak of weeks that hit it */
      const mon=mondayOf(today0());
      const wc=weekCount(name,mon);
      extra=wc+'/'+per;
      let ws=(wc>=per)?1:0;
      for(let k=1;k<104;k++){
        if(weekCount(name,addDays(mon,-7*k))>=per)ws++;else break;
      }
      if(ws>1)extra+=' ·'+ws+'w';
    }
    row.append(h('button',{class:'m'+(on?' on':''),onclick:function(){
      const list=S.habitLog[t0]||[];
      const i=list.indexOf(name);
      if(i>=0)list.splice(i,1);else list.push(name);
      if(list.length)S.habitLog[t0]=list;else delete S.habitLog[t0];
      S.logU['h:'+t0]=Date.now();
      save();render();
    }},name,extra?h('span',{class:'streak'},extra):null));
  });
  return row;
}
function moodRow(){
  const t0=iso(today0());
  if(!S.moods)S.moods={};
  const cur=S.moods[t0]||[];
  const row=h('div',{class:'mood-row'});
  MOODS.forEach(function(m){
    row.append(h('button',{class:'m'+(cur.indexOf(m)>=0?' on':''),onclick:function(){
      const list=S.moods[t0]||[];
      const i=list.indexOf(m);
      if(i>=0)list.splice(i,1);else list.push(m);
      if(list.length)S.moods[t0]=list;else delete S.moods[t0];
      S.logU['m:'+t0]=Date.now();
      save();render();
    }},m));
  });
  return row;
}

function daySection(key,name,dateLbl,tasks,grouped,isToday){
  const doneN=tasks.filter(t=>t.done).length;
  const sec=h('section',{class:'day',id:key==null?'sec-day-any':'sec-day-'+key});
  sec.append(h('div',{class:'day-head'},
    h('span',{class:'day-name'+(isToday?' td':'')},name),
    dateLbl?h('span',{class:'day-date'},dateLbl):null,
    tasks.length?h('span',{class:'day-count'},doneN+'/'+tasks.length):null
  ));
  if(isToday){
    sec.append(h('div',{class:'mood-label'},'How I’m feeling'),moodRow());
    if(S.habits.length)sec.append(h('div',{class:'mood-label'},'Habits'),habitRow());
  }
  if(grouped&&tasks.length){
    const groups=[['morning'],['afternoon'],['evening'],[null]];
    for(const g of groups){
      const sub=tasks.filter(t=>(t.timeOfDay||null)===g[0]);
      if(!sub.length)continue;
      sec.append(h('div',{class:'sub-head'},g[0]?TODLBL[g[0]]:'Anytime'));
      sub.sort(sortDay).forEach(t=>sec.append(taskEl(t,{})));
    }
  }else{
    tasks.slice().sort(sortDay).forEach(t=>sec.append(taskEl(t,{})));
  }
  sec.append(addRow(key));
  return sec;
}

function renderDays(grouped){
  const t0=today0(),w=winDates();
  const any=S.tasks.filter(t=>t.date==null);
  if(any.length||addingKey===null){
    app.append(daySection(null,'Anytime this week',null,any,grouped,false));
  }
  for(let i=0;i<7;i++){
    const d=addDays(t0,i);
    app.append(daySection(i,winLabel(i,d),fmtDayDate(d),S.tasks.filter(t=>t.date===w[i]),grouped,i===0));
  }
  if(!(any.length||addingKey===null)){
    app.append(h('div',{class:'add-row lone'},h('button',{class:'add-btn',onclick:function(){
      addingKey=null;render();
      const el=document.querySelector('#sec-day-any .add-input');
      if(el)el.focus();
    }},h('span',{class:'plus'},'+'),'Add something for whenever')));
  }
}

function renderTags(){
  const map={};const untagged=[];
  for(const t of S.tasks){
    if(!t.tags.length)untagged.push(t);
    else for(const g of t.tags){(map[g]=map[g]||[]).push(t)}
  }
  const names=Object.keys(map).sort();
  if(!names.length&&!untagged.length){
    app.append(h('p',{class:'empty-week'},'No tasks yet. Add tags by typing #tag when you add a task.'));
  }
  const sortCross=(a,b)=>dateKey(a).localeCompare(dateKey(b))||sortDay(a,b);
  for(const n of names){
    const sec=h('section',{class:'day'});
    sec.append(h('div',{class:'day-head'},h('span',{class:'day-name'},'#'+n),
      h('span',{class:'day-count'},map[n].filter(t=>t.done).length+'/'+map[n].length)));
    map[n].slice().sort(sortCross).forEach(t=>sec.append(taskEl(t,{showDay:true})));
    app.append(sec);
  }
  if(untagged.length){
    const sec=h('section',{class:'day'});
    sec.append(h('div',{class:'day-head'},h('span',{class:'day-name'},'Untagged'),
      h('span',{class:'day-count'},untagged.filter(t=>t.done).length+'/'+untagged.length)));
    untagged.slice().sort(sortCross).forEach(t=>sec.append(taskEl(t,{showDay:true})));
    app.append(sec);
  }
}

function renderFlat(){
  const sec=h('section',{class:'day'});
  sec.append(h('div',{class:'day-head'},
    h('span',{class:'day-name'},'Everything'),
    h('span',{class:'day-count'},S.tasks.filter(t=>t.done).length+'/'+S.tasks.length)));
  const list=S.tasks.slice();
  list.sort((a,b)=>dateKey(a).localeCompare(dateKey(b))||sortDay(a,b));
  list.forEach(t=>sec.append(taskEl(t,{showDay:true})));
  if(!list.length)sec.append(h('p',{class:'empty-week',style:'margin:14px 0'},'Nothing here yet.'));
  app.append(sec);
}

function renderPast(){
  const t0=today0();
  let shown=0;
  for(let i=1;i<=90;i++){
    const d=addDays(t0,-i);const ds=iso(d);
    const tasks=(S.archive[ds]||[]);
    const moods=(S.moods[ds]||[]);
    const habits=(S.habitLog[ds]||[]);
    if(!tasks.length&&!moods.length&&!habits.length)continue;
    shown++;
    const sec=h('section',{class:'day'});
    const doneN=tasks.filter(function(t){return t.done}).length;
    sec.append(h('div',{class:'day-head'},
      h('span',{class:'day-name'},i===1?'Yesterday':DAYS[wdIdx(d)]),
      h('span',{class:'day-date'},fmtDayDate(d)),
      tasks.length?h('span',{class:'day-count'},doneN+'/'+tasks.length):null));
    if(moods.length||habits.length){
      const bits=[];
      if(moods.length)bits.push('felt '+moods.join(', '));
      if(habits.length)bits.push('habits ✓ '+habits.join(', '));
      sec.append(h('div',{class:'past-sub'},bits.join(' · ')));
    }
    tasks.forEach(function(t){
      sec.append(h('div',{class:'past-item'+(t.done?' done':'')},
        h('span',{class:'pm'},t.done?'✓':'○'),
        h('span',{class:'pt'},t.title)));
    });
    sec.append(h('div',{style:'height:10px'}));
    app.append(sec);
  }
  if(!shown)app.append(h('p',{class:'empty-week'},'Nothing here yet — days collect as they pass.'));
}

/* ---------- task element ---------- */
function taskEl(t,opts){
  const wrap=h('div',{class:'task'+(t.done?' done':'')});
  const meta=[];
  if(t.time)meta.push(h('span',{class:'chip time'},fmtClock(t.time)));
  if(t.timeOfDay&&!t.time&&S.view!=='time')meta.push(h('span',{class:'chip'},TODLBL[t.timeOfDay]));
  for(const g of t.tags)meta.push(h('span',{class:'chip'},'#'+g));
  if(opts.showDay)meta.push(h('span',{class:'chip'},dayChip(t)));
  if(t.recurringId)meta.push(h('span',{class:'chip rep',title:'Repeats weekly'},'↻'));
  const subDone=t.subtasks.filter(s=>s.done).length;
  if(t.subtasks.length&&openId!==t.id)meta.push(h('span',{class:'chip time'},subDone+'/'+t.subtasks.length));

  wrap.append(h('div',{class:'task-row'},
    h('button',{class:'check'+(t.done?' on':''),'aria-label':t.done?'Mark not done':'Mark done',
      onclick:function(){t.done=!t.done;touch(t);save();render()}},'✓'),
    h('div',{class:'task-main',onclick:function(){openId=openId===t.id?null:t.id;subAddId=null;addingKey='none';render()}},
      h('div',{class:'task-title'},t.title),
      meta.length?h('div',{class:'meta'},meta):null
    ),
    h('button',{class:'sub-add-btn','aria-label':'Add a subtask',title:'Add a subtask',
      onclick:function(){
        subAddId=subAddId===t.id?null:t.id;openId=null;addingKey='none';render();
        const el=document.querySelector('.sub-quick');
        if(el)el.focus(); // synchronous within the tap so iOS opens the keyboard
      }},'+')
  ));

  if(openId===t.id){wrap.append(editorEl(t))}
  else if(t.subtasks.length||subAddId===t.id){
    const subs=h('div',{class:'subs'});
    for(const s of t.subtasks){
      (function(s){
        subs.append(h('div',{class:'sub-row'+(s.done?' done':'')},
          h('button',{class:'check sm'+(s.done?' on':''),'aria-label':'Toggle subtask',
            onclick:function(){s.done=!s.done;touch(t);save();render()}},'✓'),
          h('span',{style:'flex:1;min-width:0'},s.title),
          h('button',{class:'xbtn','aria-label':'Delete subtask',
            onclick:function(){t.subtasks=t.subtasks.filter(function(x){return x!==s});touch(t);save();render()}},'×')));
      })(s);
    }
    if(subAddId===t.id){
      let subSaved=false; // guards double-add between submit and blur
      const qInp=h('input',{type:'text',placeholder:'Add a subtask…',enterkeyhint:'done',class:'sub-quick',
        'aria-label':'New subtask',
        onkeydown:function(e){if(e.key==='Escape'){subSaved=true;subAddId=null;render()}},
        onblur:function(){setTimeout(function(){
          if(subSaved||subAddId!==t.id||document.activeElement===qInp)return;
          const v=qInp.value.trim();
          if(v){subSaved=true;t.subtasks.push({id:uid(),title:v,done:false});save()}
          subAddId=null;render();
        },150)}});
      const qForm=h('form',{onsubmit:function(e){
        e.preventDefault();
        if(!qInp.value.trim())return;
        subSaved=true;
        t.subtasks.push({id:uid(),title:qInp.value.trim(),done:false});
        touch(t);save();render();
        const again=document.querySelector('.sub-quick');if(again)again.focus();
      }},qInp);
      subs.append(h('div',{class:'sub-row'},h('span',{class:'check sm',style:'border-color:transparent'}),qForm));
    }
    wrap.append(subs);
  }
  return wrap;
}

/* ---------- add row ---------- */
function addRow(key){
  const row=h('div',{class:'add-row'});
  const dateFor=key==null?null:winDates()[key];
  if(addingKey===key){
    let saved=false; // guards double-add between submit and blur
    const inp=h('input',{class:'add-input',type:'text',placeholder:'Add a task…',
      'aria-label':'New task',enterkeyhint:'done',
      onkeydown:function(e){if(e.key==='Escape'){saved=true;addingKey='none';render()}},
      onblur:function(){setTimeout(function(){
        if(saved||addingKey!==key||document.activeElement===inp)return;
        const v=inp.value.trim();
        if(v){saved=true;addTask(dateFor,v)} // keyboard dismissed with text typed — keep it
        addingKey='none';render();
      },150)}
    });
    const form=h('form',{onsubmit:function(e){
      e.preventDefault();
      if(!inp.value.trim())return;
      saved=true;
      addTask(dateFor,inp.value);render();
      const again=document.querySelector('#'+(key==null?'sec-day-any':'sec-day-'+key)+' .add-input');
      if(again)again.focus();
    }},inp);
    row.append(form,h('div',{class:'add-hint'},'Enter to add · #word becomes a tag'));
  }else{
    row.append(h('button',{class:'add-btn',onclick:function(){
      addingKey=key;openId=null;subAddId=null;render();
      // focus synchronously within the tap gesture so iOS opens the keyboard
      const el=document.querySelector('#'+(key==null?'sec-day-any':'sec-day-'+key)+' .add-input');
      if(el)el.focus();
    }},h('span',{class:'plus'},'+'),'Add'));
  }
  return row;
}

/* ---------- editor ---------- */
function editorEl(t){
  const ed=h('div',{class:'editor'});
  const w=winDates(),t0=today0();

  const title=h('input',{type:'text',value:t.title,'aria-label':'Task title',
    onchange:function(){t.title=title.value.trim()||t.title;touch(t);syncRuleFields(t);save();render()}});
  ed.append(h('div',{class:'f'},h('label',null,'Task'),title));

  /* day + time */
  const dayOpts=[h('option',{value:''},'Anytime this week')];
  for(let i=0;i<7;i++){
    dayOpts.push(h('option',{value:w[i],selected:t.date===w[i]},winLabel(i,addDays(t0,i))));
  }
  if(t.date&&!w.includes(t.date))dayOpts.push(h('option',{value:t.date,selected:true},t.date));
  const daySel=h('select',{onchange:function(){t.date=daySel.value===''?null:daySel.value;touch(t);save();render()}},dayOpts);
  const timeInp=h('input',{type:'time',value:t.time||'',
    onchange:function(){
      t.time=timeInp.value||null;
      if(t.time)t.timeOfDay=todFromTime(t.time);
      touch(t);syncRuleFields(t);save();render();
    }});
  ed.append(h('div',{class:'frow'},
    h('div',{class:'f'},h('label',null,'Day'),daySel),
    h('div',{class:'f'},h('label',null,'Time'),timeInp)));

  /* time of day */
  const seg=h('div',{class:'seg'});
  const opts=[[null,'Any']].concat(TODS.map(x=>[x,TODLBL[x]]));
  for(const o of opts){
    (function(o){
      seg.append(h('button',{class:(t.timeOfDay||null)===o[0]?'on':'',
        onclick:function(){t.timeOfDay=o[0];touch(t);syncRuleFields(t);save();render()}},o[1]));
    })(o);
  }
  ed.append(h('div',{class:'f'},h('label',null,'Part of day'),seg));

  /* tags */
  const tagInp=h('input',{type:'text',value:t.tags.map(g=>'#'+g).join(' '),placeholder:'#errands #home',
    onchange:function(){
      t.tags=tagInp.value.split(/[\s,]+/).map(w2=>w2.replace(/^#/,'').toLowerCase()).filter(Boolean);
      touch(t);syncRuleFields(t);save();render()}});
  ed.append(h('div',{class:'f'},h('label',null,'Tags'),tagInp));

  /* subtasks */
  const subsBox=h('div',{class:'f ed-subs'},h('label',null,'Subtasks'));
  for(const s of t.subtasks){
    (function(s){
      subsBox.append(h('div',{class:'sub-row'+(s.done?' done':'')},
        h('button',{class:'check sm'+(s.done?' on':''),onclick:function(){s.done=!s.done;touch(t);save();render()}},'✓'),
        h('span',{style:'flex:1'},s.title),
        h('button',{class:'xbtn','aria-label':'Delete subtask',
          onclick:function(){t.subtasks=t.subtasks.filter(x=>x!==s);touch(t);save();render()}},'×')));
    })(s);
  }
  const subInp=h('input',{type:'text',placeholder:'Add a subtask…',enterkeyhint:'done'});
  const subForm=h('form',{onsubmit:function(e){
    e.preventDefault();
    if(!subInp.value.trim())return;
    t.subtasks.push({id:uid(),title:subInp.value.trim(),done:false});
    touch(t);save();render();
    const box=document.querySelector('.ed-subs input[type=text]');if(box)box.focus();
  }},subInp);
  subsBox.append(h('div',{class:'sub-row'},h('span',{class:'check sm',style:'border-color:transparent'}),subForm));
  ed.append(subsBox);

  /* repeat */
  const rule=ruleOf(t);
  const days=rule?rule.days.slice():[];
  const chips=h('div',{class:'dchips'});
  for(let i=0;i<7;i++){
    (function(i){
      chips.append(h('button',{class:days.includes(i)?'on':'','aria-label':DAYS[i],
        onclick:function(){
          const nd=days.includes(i)?days.filter(d=>d!==i):days.concat([i]);
          setRepeatDays(t,nd);render();
        }},DSHORT[i][0]));
    })(i);
  }
  ed.append(h('div',{class:'f'},h('label',null,'Repeats every'),chips));

  ed.append(h('div',{class:'ed-foot'},
    h('button',{class:'btn',onclick:function(){openId=null;render()}},'Done'),
    h('button',{class:'tbtn danger',onclick:function(){deleteTask(t);render()}},'Delete')));
  return ed;
}

function toast(msg){
  const old=document.querySelector('.toast');if(old)old.remove();
  const el=h('div',{class:'toast'},msg);

/* ---------- Claude API ---------- */
const KEYKEY='this-week-api-key';
function getApiKey(){
  // keys are printable ASCII; strip anything else (zero-width chars from
  // pasting make Safari's fetch throw a bare "Type error" on the header)
  try{return (localStorage.getItem(KEYKEY)||'').replace(/[^\x21-\x7e]/g,'')}catch(e){return''}
}
function callClaude(promptText,maxTokens){
  const body=JSON.stringify({
    model:'claude-opus-5',
    max_tokens:maxTokens||2048,
    output_config:{effort:'low'},
    messages:[{role:'user',content:promptText}]
  }).replace(/[\u007f-\uffff]/g,function(c){
    return '\\u'+('000'+c.charCodeAt(0).toString(16)).slice(-4);
  }); // pure-ASCII body: valid JSON, immune to encoding quirks
  return fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key':getApiKey(),
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body:body
  }).then(function(res){
    return res.json().catch(function(){return null}).then(function(data){
      if(!res.ok){
        const msg=data&&data.error&&data.error.message?data.error.message:('HTTP '+res.status);
        throw new Error(msg);
      }
      if(!data||!data.content)throw new Error('empty reply from the API');
      if(data.stop_reason==='refusal')throw new Error('The model declined this request.');
      if(data.stop_reason==='max_tokens')throw new Error('the reply ran out of room');
      return data.content.filter(function(b){return b.type==='text'})
        .map(function(b){return b.text}).join('\n').trim();
    });
  });
}

/* ---------- brain dump ---------- */
function parseDump(text){
  const t0=today0();const win=winDates();
  const vocab={};
  S.tasks.forEach(function(t){(t.tags||[]).forEach(function(g){if(g!=='calendar')vocab[g]=1})});
  const vocabList=Object.keys(vocab).slice(0,30);
  const dayList=win.map(function(ds,i){return winLabel(i,addDays(t0,i))+' = '+ds}).join(', ');
  const clean=String(text).replace(/[\u0000-\u001f\u007f-\u009f\u2028\u2029\ufeff]/g,' ').slice(0,4000);
  const prompt='Sort my brain dump into structured data. Today is '+DAYS[wdIdx(t0)]+' '+iso(t0)+'. Upcoming days: '+dayList+'.\n'
    +(S.habits.length?('My habits: '+habitNames().join(', ')+'.\n'):'')
    +'Mood words I track: '+MOODS.join(', ')+'.\n'
    +(vocabList.length?('Tags I use: '+vocabList.join(', ')+'.\n'):'')
    +'Reply with ONE JSON object only, no other text: {"tasks":[{"title":"…","date":"YYYY-MM-DD or null","timeOfDay":"morning|afternoon|evening or null","tags":["…"]}],"moods":["…"],"habits":["…"]}\n'
    +'tasks = actionable to-dos I mentioned (short cleaned-up titles; date only if I implied a day within the upcoming days, else null). moods = only my tracked mood words matching how I said I feel. habits = only habits from my list that I said I already did. Include only what I actually said.\n\nBrain dump:\n'+clean;
  return callClaude(prompt,8192).then(function(reply){
    const m=reply.match(/\{[\s\S]*\}/);
    if(!m)throw new Error('couldn’t parse the reply');
    const o=JSON.parse(m[0]);
    return {
      tasks:Array.isArray(o.tasks)?o.tasks.filter(function(x){return x&&x.title}):[],
      moods:Array.isArray(o.moods)?o.moods.map(function(x){return String(x).toLowerCase()})
        .filter(function(x){return MOODS.indexOf(x)>=0}):[],
      habits:Array.isArray(o.habits)?o.habits.map(function(x){return String(x).toLowerCase()})
        .filter(function(x){return habitNames().indexOf(x)>=0}):[]
    };
  });
}
function applyDump(r){
  const t0=iso(today0());const win=winDates();
  r.tasks.forEach(function(t){
    S.tasks.push({id:uid(),title:String(t.title).slice(0,200),
      date:(t.date&&win.indexOf(t.date)>=0)?t.date:null,
      tags:cleanTags(t.tags||[]),subtasks:[],done:false,
      timeOfDay:(['morning','afternoon','evening'].indexOf(t.timeOfDay)>=0)?t.timeOfDay:null,
      time:null,createdAt:Date.now(),recurringId:null,u:Date.now()});
  });
  if(r.moods.length){
    const list=S.moods[t0]||[];
    r.moods.forEach(function(m){if(list.indexOf(m)<0)list.push(m)});
    S.moods[t0]=list;S.logU['m:'+t0]=Date.now();
  }
  if(r.habits.length){
    const list=S.habitLog[t0]||[];
    r.habits.forEach(function(hb){if(list.indexOf(hb)<0)list.push(hb)});
    S.habitLog[t0]=list;S.logU['h:'+t0]=Date.now();
  }
  save();render();
  toast('Sorted and added');
}

/* ---------- Google Calendar ---------- */
const GCALKEY='this-week-gcal';
function gcal(){
  try{return JSON.parse(localStorage.getItem(GCALKEY))||{clientId:'',accounts:[],lastSync:0}}
  catch(e){return{clientId:'',accounts:[],lastSync:0}}
}
function saveGcal(g){try{localStorage.setItem(GCALKEY,JSON.stringify(g))}catch(e){}}

const GSCOPE='https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/userinfo.email';
function gcalRedirectUri(){return location.origin+location.pathname.replace(/index\.html$/,'')}
function brokerCall(body){
  const cl=sbClient();
  if(!cl||!sbUser)return Promise.reject(new Error('turn on sync first (Settings)'));
  return cl.functions.invoke('gcal-broker',{body:body}).then(function(r){
    if(r.error){
      if(r.error.context&&r.error.context.json){
        return r.error.context.json().catch(function(){return{}}).then(function(jd){
          throw new Error(jd.error||r.error.message||'broker error');
        });
      }
      throw new Error(r.error.message||'broker error');
    }
    if(r.data&&r.data.error)throw new Error(r.data.error);
    return r.data;
  });
}
function freshToken(acc){
  if(acc.token&&Date.now()<acc.expiry)return Promise.resolve(acc.token);
  return brokerCall({action:'token',email:acc.email}).then(function(d){
    acc.token=d.access_token;
    acc.expiry=Date.now()+(((d.expires_in||3600)-60)*1000);
    acc.needsReauth=false;
    const g=gcal();
    const i=g.accounts.findIndex(function(a){return a.email===acc.email});
    if(i>=0){g.accounts[i]=acc;saveGcal(g)}
    return acc.token;
  }).catch(function(e){
    const g=gcal();
    const a=g.accounts.find(function(x){return x.email===acc.email});
    if(a){a.needsReauth=true;saveGcal(g)}
    throw new Error(e&&e.message?e.message:'needs a re-connect');
  });
}
function reconnectAccount(email){
  connectGoogleAccount(email);
}
function connectGoogleAccount(hint){
  const g=gcal();
  if(!g.clientId){toast('Paste your Google Client ID first');return}
  if(!sbUser){toast('Turn on sync first — the permanent connection lives in your Supabase');return}
  const params=new URLSearchParams({
    client_id:g.clientId,
    response_type:'code',
    redirect_uri:gcalRedirectUri(),
    scope:GSCOPE,
    access_type:'offline',
    prompt:'consent'
  });
  if(hint&&typeof hint==='string')params.set('login_hint',hint);
  else params.set('prompt','consent select_account');
  location.href='https://accounts.google.com/o/oauth2/v2/auth?'+params.toString();
}
function disconnectGoogleAccount(email){
  brokerCall({action:'remove',email:email}).catch(function(){});
  const g=gcal();
  g.accounts=g.accounts.filter(function(a){return a.email!==email});
  saveGcal(g);
  toast('Disconnected '+email);
  showSettings();
}

function gFetch(url,token){
  return fetch(url,{headers:{Authorization:'Bearer '+token}}).then(function(r){
    if(!r.ok)throw new Error('Google API error '+r.status);
    return r.json();
  });
}
function collectEvents(){
  const g=gcal();
  const t0=today0();
  const timeMin=t0.toISOString();
  const timeMax=addDays(t0,7).toISOString();
  const all=[];const errors=[];const okCals=[];
  let chain=Promise.resolve();
  g.accounts.forEach(function(acc){
    chain=chain.then(function(){
      return freshToken(acc).then(function(tok){
        return gFetch('https://www.googleapis.com/calendar/v3/users/me/calendarList',tok)
          .then(function(cl){
            const cals=(cl.items||[]).filter(function(c){return c.selected!==false});
            let sub=Promise.resolve();
            cals.forEach(function(cal){
              sub=sub.then(function(){
                const url='https://www.googleapis.com/calendar/v3/calendars/'
                  +encodeURIComponent(cal.id)
                  +'/events?singleEvents=true&orderBy=startTime&maxResults=100'
                  +'&timeMin='+encodeURIComponent(timeMin)
                  +'&timeMax='+encodeURIComponent(timeMax);
                return gFetch(url,tok).then(function(ev){
                  okCals.push(acc.email+'|'+cal.id);
                  (ev.items||[]).forEach(function(e){
                    if(e.status==='cancelled')return;
                    const me=(e.attendees||[]).find(function(a){return a.self});
                    if(me&&me.responseStatus==='declined')return;
                    all.push({
                      key:acc.email+'|'+cal.id+'|'+e.id,
                      title:e.summary||'(untitled)',
                      date:(e.start&&e.start.dateTime)?e.start.dateTime.slice(0,10):(e.start?e.start.date:null),
                      time:(e.start&&e.start.dateTime)?e.start.dateTime.slice(11,16):null,
                      allDay:!(e.start&&e.start.dateTime),
                      calendar:cal.summaryOverride||cal.summary||'',
                      eventType:e.eventType||'default'
                    });
                  });
                }).catch(function(err){errors.push(cal.summary+': '+err.message)});
              });
            });
            return sub;
          });
      }).catch(function(err){errors.push(acc.email+': '+err.message)});
    });
  });
  return chain.then(function(){return {events:all,errors:errors,okCals:okCals}});
}

function todFromTime(t){const hh=+t.slice(0,2);return hh<12?'morning':(hh<17?'afternoon':'evening')}
function fmtClock(t){let hh=+t.slice(0,2);const mm=t.slice(3,5);const ap=hh>=12?'PM':'AM';hh=hh%12||12;
  return hh+(mm!=='00'?':'+mm:'')+' '+ap}

function cleanText(s){
  return String(s==null?'':s)
    .replace(/[\u0000-\u001f\u007f-\u009f\u2028\u2029\ufeff]/g,' ')
    .replace(/\s+/g,' ').trim().slice(0,200);
}
function cleanTags(a){
  if(!Array.isArray(a))return[];
  return a.map(function(g){return String(g).toLowerCase().replace(/^#/,'').replace(/[^a-z0-9-]/g,'')})
    .filter(function(g){return g&&g!=='calendar'&&/[a-z0-9]/.test(g)}).slice(0,2);
}
function classifyEvents(evs){
  const vocab={};
  S.tasks.forEach(function(t){(t.tags||[]).forEach(function(g){if(g!=='calendar')vocab[g]=1})});
  (S.recurring||[]).forEach(function(r){(r.tags||[]).forEach(function(g){if(g!=='calendar')vocab[g]=1})});
  const vocabList=Object.keys(vocab).slice(0,30);
  const list=evs.map(function(e,i){
    return JSON.stringify({i:i,title:cleanText(e.title),date:e.date,time:e.time,
      allDay:!!e.allDay,calendar:cleanText(e.calendar)});
  }).join('\n');
  const prompt='These are upcoming events from my calendar. For each one, decide whether it needs me to actively do or attend something (meetings, calls, classes, appointments, errands, deadlines, things to prepare) — or whether it is only informational (birthdays, holidays, other people’s time off, anniversaries, observances, FYI markers).\n\nReply with ONE JSON array and nothing else, like: [{"i":0,"task":true,"title":"…","tags":["coaching"]},{"i":1,"task":false,"title":"…","tags":[]}]\nOne object per event: "i" is the event index, "task" is whether it needs doing, "title" is a short cleaned-up task title with no date in it, "tags" is 0–2 short lowercase topic tags for the event.'
    +(vocabList.length?' Prefer my existing tags when one fits: '+vocabList.join(', ')+'. Only invent a new tag when the topic is clear (like coaching, workout, travel); otherwise use [].':' Only add a tag when the topic is clear (like coaching, workout, travel); otherwise use [].')
    +'\n\n'+list;
  return callClaude(prompt,8192)
    .catch(function(){return callClaude(prompt,8192)}) // one retry for transient network blips
    .then(function(text){
      // accept a proper array, or one JSON object per line (models mirror the input format)
      let arr=null;
      const m=text.match(/\[[\s\S]*\]/);
      if(m){try{const p=JSON.parse(m[0]);if(Array.isArray(p))arr=p}catch(e){}}
      if(!arr){
        const objs=text.match(/\{[^{}]*\}/g);
        if(objs&&objs.length){
          arr=[];
          objs.forEach(function(o){try{arr.push(JSON.parse(o))}catch(e){}});
        }
      }
      if(!arr||!arr.length)throw new Error('AI reply wasn’t JSON: “'+text.slice(0,80)+'…”');
      return arr;
    });
}

let calSyncing=false;
function syncCalendar(manual){
  if(calSyncing)return;
  const g=gcal();
  if(!g.clientId||!g.accounts.length){if(manual)toast('Connect a Google account in Settings first');return}
  if(!getApiKey()){if(manual)toast('Add your Claude API key first — it decides what’s a task');return}
  calSyncing=true;
  if(manual)toast('Syncing your calendars…');
  let stage='reading your calendars';
  function noteError(msg){const g2=gcal();g2.lastError=msg;saveGcal(g2)}
  collectEvents().then(function(res){
    stage='reconciling with your calendar';
    if(!S.calSeen)S.calSeen={};
    const t0=iso(today0());
    for(const k in S.calSeen){if(S.calSeen[k].d&&S.calSeen[k].d<t0)delete S.calSeen[k]}
    const win=winDates();

    const evByKey={};res.events.forEach(function(e){evByKey[e.key]=e});
    const okSet={};(res.okCals||[]).forEach(function(p){okSet[p]=1});
    function calOfKey(key){const p=key.split('|');return p[0]+'|'+p[1]}

    /* reconcile existing calendar-born tasks (unchecked only; done tasks are a record) */
    let removed=0,updated=0;
    const renamed=[]; // {task, ev} — needs AI re-check
    const retag=[];   // {task, ev} — one-time tag backfill for older calendar tasks
    S.tasks=S.tasks.filter(function(t){
      if(!t.eventKey||t.done)return true;
      if(!okSet[calOfKey(t.eventKey)])return true; // couldn't read that calendar this sync — leave alone
      const ev=evByKey[t.eventKey];
      if(!ev){delete S.calSeen[t.eventKey];entomb(t.id);removed++;return false} // event deleted (or left the week)
      if(!t.calTitle)t.calTitle=t.title.replace(/\s*\([^()]*\)\s*$/,'');
      if(t.calRawTitle==null)t.calRawTitle=ev.title;
      const newTime=ev.time||null;
      if(ev.date!==t.date||newTime!==t.time){updated++;touch(t)}
      t.date=ev.date;
      t.time=newTime;
      t.timeOfDay=ev.time?todFromTime(ev.time):null;
      t.title=t.calTitle; // time lives in the time field, not the title
      if(S.calSeen[t.eventKey])S.calSeen[t.eventKey].d=ev.date;
      if(ev.title!==t.calRawTitle)renamed.push({task:t,ev:ev});
      else if(!t.calTagged&&t.tags.filter(function(g){return g!=='calendar'}).length===0){
        retag.push({task:t,ev:ev});
      }
      return true;
    });
    /* forget skipped events that no longer exist, so a re-created event gets a fresh look */
    for(const k in S.calSeen){
      if(okSet[calOfKey(k)]&&!evByKey[k])delete S.calSeen[k];
    }

    stage='choosing events';
    const fresh=res.events.filter(function(e){
      if(!e.date||win.indexOf(e.date)<0)return false;
      if(S.calSeen[e.key])return false;
      if(e.eventType==='birthday'||e.eventType==='workingLocation'||e.eventType==='outOfOffice'){
        S.calSeen[e.key]={d:e.date};return false;
      }
      return true;
    });

    const toClassify=[];
    fresh.forEach(function(e){toClassify.push({e:e,kind:'new'})});
    renamed.forEach(function(r){toClassify.push({e:r.ev,kind:'rename',task:r.task})});
    retag.forEach(function(r){toClassify.push({e:r.ev,kind:'retag',task:r.task})});

    function finish(added){
      calSyncing=false;
      g.lastSync=Date.now();
      g.lastError=res.errors.length?('Partly synced — couldn’t read: '+res.errors.join(' · ')):'';
      saveGcal(g);
      save();render();
      const bits=[];
      if(added>0)bits.push('added '+added);
      if(updated>0)bits.push('updated '+updated);
      if(removed>0)bits.push('removed '+removed);
      if(bits.length)toast('Calendar: '+bits.join(' · '));
      else if(manual)toast(res.errors.length?('Sync issue: '+res.errors[0]):'Calendar is in sync — nothing to change');
    }

    if(!toClassify.length){finish(0);return}
    stage='asking Claude about '+toClassify.length+' event'+(toClassify.length===1?'':'s');
    return classifyEvents(toClassify.map(function(x){return x.e})).then(function(verdicts){
      stage='applying changes';
      let added=0;
      verdicts.forEach(function(v){
        const item=toClassify[v.i];
        if(!item)return;
        const e=item.e;
        if(item.kind==='new'){
          if(S.calSeen[e.key])return;
          S.calSeen[e.key]={d:e.date};
          if(v.task){
            const calTitle=v.title||e.title;
            S.tasks.push({id:'cal@'+e.key,title:calTitle,
              date:e.date,tags:['calendar'].concat(cleanTags(v.tags)),subtasks:[],done:false,
              timeOfDay:e.time?todFromTime(e.time):null,time:e.time||null,
              createdAt:Date.now(),recurringId:null,
              eventKey:e.key,calTitle:calTitle,calRawTitle:e.title,calTagged:1,u:Date.now()});
            added++;
          }
        }else if(item.kind==='rename'){ // renamed event — refresh or retire its task
          const t=item.task;
          t.calRawTitle=e.title;
          t.calTagged=1;
          if(v.task){
            t.calTitle=v.title||e.title;
            t.title=t.calTitle;
            cleanTags(v.tags).forEach(function(g){if(t.tags.indexOf(g)<0)t.tags.push(g)});
            touch(t);updated++;
          }else{
            entomb(t.id);
            S.tasks=S.tasks.filter(function(x){return x!==t});
            S.calSeen[e.key]={d:e.date};
            removed++;
          }
        }else{ // retag — one-time tag backfill; never changes task-ness or title
          const t=item.task;
          t.calTagged=1;
          const add=cleanTags(v.tags);
          add.forEach(function(g){if(t.tags.indexOf(g)<0)t.tags.push(g)});
          if(add.length)updated++;
        }
      });
      finish(added);
    });
  }).catch(function(e){
    calSyncing=false;
    let detail=(e&&e.name?e.name+': ':'')+((e&&e.message)?e.message:String(e));
    if(e&&e.stack)detail+=' @ '+String(e.stack).replace(/\s+/g,' ').slice(0,220);
    noteError('Failed while '+stage+' — '+detail);
    if(manual)toast('Sync failed while '+stage+' (details in Settings)');
  });
}

function syncCfg(){try{return JSON.parse(localStorage.getItem(SYNCKEY))||{}}catch(e){return{}}}
function saveSyncCfg(c){try{localStorage.setItem(SYNCKEY,JSON.stringify(c))}catch(e){}}
let sb=null,sbUser=null,pushTimer=null,sbLoading=null;

function syncPayload(){
  return {tasks:S.tasks,recurring:S.recurring,moods:S.moods,habits:S.habits,habitsU:S.habitsU||0,
    habitLog:S.habitLog,archive:S.archive,calSeen:S.calSeen||{},deleted:S.deleted,logU:S.logU};
}
function mergeState(remote){ /* returns true if local S changed */
  if(!remote)return false;
  const before=JSON.stringify(syncPayload());
  const rdel=remote.deleted||{};
  function mergeList(localList,remoteList){
    const map={};
    (localList||[]).forEach(function(t){map[t.id]=t});
    (remoteList||[]).forEach(function(rt){
      if(!rt||!rt.id)return;
      if(S.deleted[rt.id]&&S.deleted[rt.id]>=(rt.u||0))return;
      const lt=map[rt.id];
      if(!lt||((rt.u||0)>(lt.u||0)))map[rt.id]=rt;
    });
    Object.keys(map).forEach(function(id){
      if(rdel[id]&&rdel[id]>=(map[id].u||0))delete map[id];
    });
    return Object.keys(map).map(function(k){return map[k]});
  }
  S.tasks=mergeList(S.tasks,remote.tasks);
  S.recurring=mergeList(S.recurring,remote.recurring);
  Object.keys(rdel).forEach(function(id){S.deleted[id]=Math.max(S.deleted[id]||0,rdel[id])});
  if((remote.habitsU||0)>(S.habitsU||0)){S.habits=(remote.habits||[]);S.habitsU=remote.habitsU}
  const rlu=remote.logU||{};
  Object.keys(rlu).forEach(function(k){
    if(rlu[k]>(S.logU[k]||0)){
      S.logU[k]=rlu[k];
      const date=k.slice(2);
      if(k[0]==='m'){
        const v=(remote.moods||{})[date];
        if(v&&v.length)S.moods[date]=v;else delete S.moods[date];
      }else{
        const v=(remote.habitLog||{})[date];
        if(v&&v.length)S.habitLog[date]=v;else delete S.habitLog[date];
      }
    }
  });
  Object.keys(remote.moods||{}).forEach(function(d){if(!S.moods[d]&&!S.logU['m:'+d])S.moods[d]=remote.moods[d]});
  Object.keys(remote.habitLog||{}).forEach(function(d){if(!S.habitLog[d]&&!S.logU['h:'+d])S.habitLog[d]=remote.habitLog[d]});
  Object.keys(remote.archive||{}).forEach(function(d){
    const loc=S.archive[d]||[];
    (remote.archive[d]||[]).forEach(function(e){
      if(!loc.some(function(x){return x.title===e.title&&x.done===e.done}))loc.push(e);
    });
    S.archive[d]=loc;
  });
  if(!S.calSeen)S.calSeen={};
  Object.keys(remote.calSeen||{}).forEach(function(k){if(!S.calSeen[k])S.calSeen[k]=remote.calSeen[k]});
  return JSON.stringify(syncPayload())!==before;
}

function loadSb(){
  if(window.supabase)return Promise.resolve();
  if(sbLoading)return sbLoading;
  sbLoading=new Promise(function(res,rej){
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    s.onload=res;
    s.onerror=function(){sbLoading=null;rej(new Error('couldn’t load the sync library — this works on the hosted app'))};
    document.head.appendChild(s);
  });
  return sbLoading;
}
function sbClient(){
  const c=syncCfg();
  if(!c.url||!c.anon||!window.supabase)return null;
  if(!sb)sb=window.supabase.createClient(c.url,c.anon);
  return sb;
}
function startSync(){
  const c=syncCfg();
  if(!c.url||!c.anon)return Promise.resolve();
  return loadSb().then(function(){
    const cl=sbClient();if(!cl)return;
    return cl.auth.getSession().then(function(res){
      const session=res.data?res.data.session:null;
      if(!session){sbUser=null;return}
      sbUser=session.user;
      return pullMerge(true).then(function(){
        cl.channel('state-'+sbUser.id)
          .on('postgres_changes',{event:'*',schema:'public',table:'app_state',filter:'user_id=eq.'+sbUser.id},
            function(payload){
              if(payload.new&&payload.new.data){
                if(mergeState(payload.new.data)){save();render()}
              }
            })
          .subscribe();
      });
    });
  }).catch(function(){});
}
function pullMerge(pushAfter){
  const cl=sbClient();
  if(!cl||!sbUser)return Promise.resolve();
  return cl.from('app_state').select('data').eq('user_id',sbUser.id).maybeSingle()
    .then(function(r){
      let changed=false;
      if(r&&r.data&&r.data.data)changed=mergeState(r.data.data);
      if(changed){save();render()}
      if(pushAfter)return pushNow();
    }).catch(function(){});
}
function schedulePush(){
  if(!sbUser)return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(pushNow,1500);
}
function pushNow(){
  const cl=sbClient();
  if(!cl||!sbUser)return Promise.resolve();
  return cl.from('app_state')
    .upsert({user_id:sbUser.id,data:syncPayload(),updated_at:new Date().toISOString()})
    .then(function(){},function(){});
}
function syncSignIn(email,pw){
  return loadSb().then(function(){
    const cl=sbClient();
    if(!cl)throw new Error('save the project URL and key first');
    return cl.auth.signInWithPassword({email:email,password:pw}).then(function(r){
      if(!r.error)return r;
      return cl.auth.signUp({email:email,password:pw}).then(function(r2){
        if(r2.error)throw new Error(r2.error.message);
        return cl.auth.signInWithPassword({email:email,password:pw}).then(function(r3){
          if(r3.error)throw new Error(r3.error.message+' (if it mentions confirmation, turn off “Confirm email” in Supabase Auth settings)');
          return r3;
        });
      });
    });
  });
}

/* ---------- settings ---------- */
function showSettings(){settingsOpen=true;render()}
function closeSettings(){settingsOpen=false;render()}
function settingsPage(){
  const hasKey=!!getApiKey();

  const keyInp=h('input',{type:'password',placeholder:hasKey?'Key saved on this device':'sk-ant-…',
    autocomplete:'off','aria-label':'Claude API key'});
  const keySec=h('div',{class:'set-sec'},
    h('label',null,'Claude API key'),
    keyInp,
    h('div',{style:'display:flex;gap:10px;align-items:center'},
      h('button',{class:'btn sm',onclick:function(){
        const v=keyInp.value.trim();
        if(!v){toast('Paste a key first');return}
        try{localStorage.setItem(KEYKEY,v)}catch(e){}
        keyInp.value='';keyInp.placeholder='Key saved on this device';
        toast('Key saved — ✦ now gives instant summaries');
      }},'Save'),
      hasKey?h('button',{class:'tbtn danger',style:'margin-left:0',onclick:function(){
        try{localStorage.removeItem(KEYKEY)}catch(e){}
        render();toast('Key removed');
      }},'Remove key'):null
    ),
    h('p',{class:'set-note'},'Stored only in this browser, sent only to Anthropic. Powers the brain dump and calendar sorting.'));

  function perOptions(sel){
    return [7,6,5,4,3,2,1].map(function(n){
      return h('option',{value:String(n),selected:n===sel},n===7?'daily':n+'×/week');
    });
  }
  const habInp=h('input',{type:'text',placeholder:'Add a habit…','aria-label':'New habit',style:'margin-bottom:0'});
  const habPer=h('select',{'aria-label':'Times per week'},perOptions(7));
  const habForm=h('form',{style:'flex:1;min-width:0',onsubmit:function(e){
    e.preventDefault();
    const v=habInp.value.trim().toLowerCase();
    if(!v)return;
    if(habitNames().indexOf(v)<0){S.habits.push({name:v,per:+habPer.value||7});S.habitsU=Date.now();save()}
    showSettings();
  }},habInp);
  const habSec=h('div',{class:'set-sec'},
    h('label',null,'Habits'),
    S.habits.map(function(hb){
      const rowSel=h('select',{'aria-label':'Frequency for '+hb.name,
        onchange:function(){hb.per=+rowSel.value||7;S.habitsU=Date.now();save()}},perOptions(hb.per||7));
      return h('div',{class:'acct-row'},
        h('span',{class:'em'},hb.name),
        rowSel,
        h('button',{class:'xbtn','aria-label':'Remove habit '+hb.name,
          onclick:function(){S.habits=S.habits.filter(function(x){return x!==hb});S.habitsU=Date.now();save();showSettings()}},'×'));
    }),
    h('div',{style:'display:flex;gap:8px;align-items:center'},habForm,habPer),
    h('p',{class:'set-note'},'Shown on Today as tappable chips. Weekly-target habits count Mon–Sun and streak by weeks hit, so rest days don’t break anything. History is kept forever.'));

  const g=gcal();
  const cidInp=h('input',{type:'text',autocomplete:'off',spellcheck:'false',
    placeholder:g.clientId?'Client ID saved':'….apps.googleusercontent.com',
    'aria-label':'Google OAuth Client ID',
    onchange:function(){
      const v=cidInp.value.trim();
      if(!v)return;
      const g2=gcal();g2.clientId=v;saveGcal(g2);
      cidInp.value='';cidInp.placeholder='Client ID saved';
      toast('Client ID saved');
    }});
  const calSec=h('div',{class:'set-sec'},
    h('label',null,'Google Calendar'),
    cidInp,
    g.accounts.map(function(a){
      return h('div',{class:'acct-row'},
        h('span',{class:'em'},a.email),
        a.needsReauth?h('button',{class:'tbtn',style:'color:var(--danger);padding:2px 4px',
          onclick:function(){reconnectAccount(a.email)}},'reconnect'):null,
        h('button',{class:'xbtn','aria-label':'Disconnect '+a.email,
          onclick:function(){disconnectGoogleAccount(a.email)}},'×'));
    }),
    h('div',{style:'display:flex;gap:10px;align-items:center;flex-wrap:wrap'},
      h('button',{class:'btn sm',onclick:connectGoogleAccount},
        g.accounts.length?'Connect another account':'Connect an account'),
      g.accounts.length?h('button',{class:'tbtn',onclick:function(){
        closeSettings();
        syncCalendar(true);
      }},'Sync now'):null
    ),
    g.lastError?h('p',{class:'set-note',style:'color:var(--danger)'},g.lastError):null,
    h('p',{class:'set-note'},
      g.lastSync
        ?('Last synced '+new Date(g.lastSync).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+'. Claude decides which events need doing; birthdays and FYIs are skipped.')
        :'Connect each Google account once — the permanent connection lives in your Supabase, no repeat logins. Turn on sync first. Works on the hosted app.'));

  const sc=syncCfg();
  const urlInp=h('input',{type:'text',autocomplete:'off',spellcheck:'false',
    placeholder:sc.url?'Project URL saved':'https://xxxx.supabase.co','aria-label':'Supabase URL',
    onchange:function(){const v=urlInp.value.trim();if(!v)return;
      const c=syncCfg();c.url=v.replace(/\/+$/,'');saveSyncCfg(c);sb=null;
      urlInp.value='';urlInp.placeholder='Project URL saved';toast('Saved')}});
  const anonInp=h('input',{type:'text',autocomplete:'off',spellcheck:'false',
    placeholder:sc.anon?'Anon key saved':'anon public key','aria-label':'Supabase anon key',
    onchange:function(){const v=anonInp.value.trim();if(!v)return;
      const c=syncCfg();c.anon=v;saveSyncCfg(c);sb=null;
      anonInp.value='';anonInp.placeholder='Anon key saved';toast('Saved')}});
  const emailInp=h('input',{type:'text',autocomplete:'off',placeholder:'email','aria-label':'Sync email'});
  const pwInp=h('input',{type:'password',autocomplete:'off',placeholder:'password','aria-label':'Sync password'});
  const syncSec=h('div',{class:'set-sec'},
    h('label',null,'Sync across devices'),
    sbUser
      ?[h('div',{class:'acct-row'},
          h('span',{class:'em'},sbUser.email||'(signed in)'),
          h('button',{class:'xbtn','aria-label':'Sign out of sync',
            onclick:function(){const cl=sbClient();if(cl)cl.auth.signOut();sbUser=null;toast('Sync off on this device');render()}},'×')),
        h('p',{class:'set-note'},'Live sync is on. Changes flow between your signed-in devices within seconds.')]
      :[urlInp,anonInp,emailInp,pwInp,
        h('button',{class:'btn sm',onclick:function(){
          const em=emailInp.value.trim(),pw=pwInp.value;
          if(!em||!pw){toast('Enter an email and password');return}
          syncSignIn(em,pw).then(function(){
            toast('Sync is on');
            return startSync();
          }).then(function(){render()})
            .catch(function(e){toast('Sign-in didn’t work: '+e.message)});
        }},'Turn on sync'),
        h('p',{class:'set-note'},'Uses your own free Supabase project. Same email + password on each device. Works on the hosted app.')]);

  const exTa=h('textarea',{class:'short',readonly:true,'aria-label':'Exported tasks'});
  const exSec=h('div',{class:'set-sec'},
    h('label',null,'Export tasks'),
    exTa,
    h('button',{class:'btn sm',onclick:function(){
      exTa.value=JSON.stringify(S);
      exTa.select();
      try{document.execCommand('copy');toast('Copied — paste into Import on the other copy')}catch(e){}
    }},'Copy my data'));

  const imTa=h('textarea',{class:'short',placeholder:'Paste exported data here…','aria-label':'Import tasks'});
  const imSec=h('div',{class:'set-sec'},
    h('label',null,'Import tasks'),
    imTa,
    h('button',{class:'btn sm',onclick:function(){
      try{
        const parsed=JSON.parse(imTa.value);
        if(!parsed||!Array.isArray(parsed.tasks))throw new Error('bad');
        S=defaults(migrate(parsed));
        if(S.view==='added')S.view='days';
        save();settingsOpen=false;
        pendingRollover=null;ensureDay();render();
        toast('Imported '+S.tasks.length+' task'+(S.tasks.length===1?'':'s'));
      }catch(e){toast('That doesn’t look like exported data')}
    }},'Import'));

  return h('section',{class:'day',style:'margin-top:8px'},
    h('div',{style:'display:flex;align-items:baseline'},
      h('h2',{style:'font-size:20px;font-weight:500;letter-spacing:-.01em;margin:0 0 10px'},'Settings'),
      h('button',{class:'tbtn',style:'margin-left:auto',onclick:closeSettings},'‹ Back')),
    keySec,habSec,calSec,syncSec,exSec,imSec);
}

/* ---------- catch-up modal ---------- */
function renderModal(){
  const root=document.getElementById('modalRoot');root.textContent='';
  const n=pendingRollover.count,d=pendingRollover.done,total=pendingRollover.total;
  root.append(h('div',{class:'overlay'},h('div',{class:'modal',role:'dialog','aria-modal':'true'},
    h('h2',null,'A new day'),
    h('p',null,'You finished '+d+' of '+total+' from last time. '
      +(n===1?'1 task is still open.':n+' tasks are still open.')
      +' Repeating tasks take care of themselves.'),
    h('button',{class:'btn',onclick:function(){resolveRollover(true)}},
      n===1?'Move it to today':'Move them to today'),
    h('button',{class:'ghost',onclick:function(){resolveRollover(false)}},'Let '+(n===1?'it':'them')+' go')
  )));
}

/* ---------- boot ---------- */
(function pinViewport(){
  let m=document.querySelector('meta[name=viewport]');
  if(!m){m=document.createElement('meta');m.setAttribute('name','viewport');
    m.setAttribute('content','width=device-width, initial-scale=1');
    (document.head||document.body).appendChild(m)}
  if(!/maximum-scale/.test(m.getAttribute('content')||''))
    m.setAttribute('content',m.getAttribute('content')+', maximum-scale=1');
})();
document.getElementById('dumpBtn').addEventListener('click',showDump);
document.addEventListener('pointerdown',function(e){
  const a=document.activeElement;
  if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')
    &&!(e.target.closest&&e.target.closest('input,textarea,select,form,.editor'))){
    a.blur();
  }
},true);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&openId){openId=null;render()}});
function autoSyncIfDue(){
  const g=gcal();
  if(g.clientId&&g.accounts.length&&getApiKey()&&Date.now()-g.lastSync>3600*1000){
    setTimeout(function(){syncCalendar(false)},800);
  }
}
document.addEventListener('visibilitychange',function(){
  if(!document.hidden){ensureDay();render();autoSyncIfDue();if(sbUser)pullMerge(false);else startSync()}
});
ensureDay();
render();
/* quiet calendar sync at most every 6 hours, on load and on resume;
   silent token refresh may fail without a user gesture — that's fine,
   manual Sync now (or the reconnect button) still works */
autoSyncIfDue();
const oauthCode=(function(){
  const m=location.search.match(/[?&]code=([^&]+)/);
  if(!m)return null;
  try{history.replaceState(null,'',location.pathname)}catch(e){}
  return decodeURIComponent(m[1]);
})();
startSync().then(function(){
  if(oauthCode&&sbUser){
    brokerCall({action:'exchange',code:oauthCode,redirect_uri:gcalRedirectUri()}).then(function(d){
      const g=gcal();
      const acc={email:d.email,token:d.access_token,expiry:Date.now()+(((d.expires_in||3600)-60)*1000),needsReauth:false};
      const i=g.accounts.findIndex(function(a){return a.email===acc.email});
      if(i>=0)g.accounts[i]=acc;else g.accounts.push(acc);
      saveGcal(g);
      toast('Connected '+d.email+' — no more logins needed');
      render();
      syncCalendar(true);
    }).catch(function(e){toast('Google connect didn’t finish: '+e.message)});
  }else if(oauthCode){
    toast('Turn on sync first, then connect Google again');
  }else if(sbUser){
    brokerCall({action:'list'}).then(function(d){
      const g=gcal();let added=0;
      (d.emails||[]).forEach(function(em){
        if(!g.accounts.some(function(a){return a.email===em})){g.accounts.push({email:em,token:null,expiry:0});added++}
      });
      if(added){saveGcal(g);render()}
    }).catch(function(){});
  }
});
})();
</script>
